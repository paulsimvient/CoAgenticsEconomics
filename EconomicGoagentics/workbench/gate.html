<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/>
<title>Request access — CoAgentics</title>
<style>
:root{--ink:#102f4c;--paper:#f7f2e8;--gold:#a57b23}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:Georgia,'Times New Roman',serif}
body{min-height:100vh;display:grid;place-items:center;padding:6vh 6vw}
.card{width:min(560px,100%);padding:2.4rem 2.2rem 2.2rem}
.eyebrow{font-family:Arial,Helvetica,sans-serif;letter-spacing:.18em;text-transform:uppercase;font-size:13px;color:var(--gold);font-weight:700;margin-bottom:1.1rem}
h1{margin:0 0 .9rem;font-size:clamp(42px,6vw,64px);line-height:.95;font-weight:500;letter-spacing:-.04em}
.rule{width:72px;height:2px;background:var(--gold);margin:0 0 1.4rem}
p{margin:0 0 1.6rem;font-size:clamp(18px,2vw,22px);line-height:1.35;max-width:28ch}
form{display:grid;gap:.7rem}
label{font-family:Arial,Helvetica,sans-serif;font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
input{width:100%;padding:.95rem 1rem;border:1px solid rgba(16,47,76,.22);border-radius:12px;background:#fff;color:var(--ink);font-size:18px;font-family:Arial,Helvetica,sans-serif}
input:focus{outline:2px solid var(--gold);outline-offset:1px}
button{margin-top:.4rem;padding:.95rem 1.1rem;border:0;border-radius:12px;background:#102f4c;color:#f7f2e8;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:700;letter-spacing:.04em;cursor:pointer}
button:hover{background:#1a4468}
.fine{margin:1.3rem 0 0;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:1.4;color:rgba(16,47,76,.62);max-width:42ch}
.err{display:none;font-family:Arial,Helvetica,sans-serif;color:#a33;font-size:14px}
</style>
</head>
<body>
<div class="card">
  <div class="eyebrow">INVIA Digital · CoAgentics</div>
  <h1>Request access</h1>
  <div class="rule"></div>
  <p>Enter your email to open the lab, the intro film, the Q1 results, and the technical white paper.</p>
  <form method="post" action="/api/access/email" id="gateForm">
    <input type="hidden" name="next" id="next" value="/"/>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" required maxlength="200" autocomplete="email" placeholder="you@organization.com" autofocus/>
    <div class="err" id="err">Enter a valid email.</div>
    <button type="submit">Continue</button>
  </form>
  <p class="fine">We’ll use this to follow up. Nothing here is a public dataset.</p>
</div>
<script>
(function(){
  const q=new URLSearchParams(location.search);
  const next=q.get('next')||'/';
  document.getElementById('next').value=next;
  document.getElementById('gateForm').addEventListener('submit',async function(e){
    const email=document.getElementById('email').value.trim();
    if(!/^[^\s@]+@[^\s@]+\.[A-Za-z]{2,}$/.test(email)){
      e.preventDefault();
      document.getElementById('err').style.display='block';
    }
  });
})();
</script>
</body>
</html>
