.main{min-width:0}.top{height:68px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;gap:24px;position:sticky;top:0;z-index:20}.top-title{font-size:18px;font-weight:750}.top-sub{font-size:11px;color:var(--muted)}.top-spacer{flex:1}.status{font-size:11px;color:var(--muted);display:flex;gap:7px;align-items:center}.dot{width:7px;height:7px;border-radius:50%;background:var(--green)}.btn{border:1px solid #b8c8d6;background:white;color:var(--ink);border-radius:5px;padding:8px 12px}.btn.primary{background:var(--blue);border-color:var(--blue2);color:white;font-weight:700}.btn.secondary{background:#edf5fc;border-color:#a8c8e5;color:#0d5b9c}.btn.danger{color:var(--red);background:#fff6f6;border-color:#e1b5b5}.content{padding:22px 26px 40px;max-width:1600px;margin:auto}.stepbar{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-bottom:18px}.step{background:#dce6ee;color:#5d7487;border-radius:5px;padding:8px 10px;font-size:11px;font-weight:650}.step.active{background:#1b72bd;color:white}.step.done{background:#dff1e8;color:#23734f}.step small{display:block;font-weight:500;opacity:.85;margin-top:2px}
.page{display:none}.page.active{display:block}.hero{display:flex;justify-content:space-between;align-items:end;gap:20px;margin:8px 0 18px}.hero h1{margin:0;font-size:26px}.hero p{margin:5px 0 0;color:var(--muted);font-size:13px}.hero-actions{display:flex;gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:white;border:1px solid var(--line);border-radius:6px;overflow:hidden;box-shadow:0 2px 7px rgba(16,42,64,.04)}.card h2{font-size:15px;margin:0;padding:14px 16px;border-bottom:1px solid #e1e8ee}.card-body{padding:15px}.choice{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid #edf1f4}.choice:last-child{border-bottom:0}.choice input{margin-top:3px}.choice b{font-size:13px}.choice small{display:block;color:var(--muted);margin-top:2px;line-height:1.35}.radio-row{display:flex;gap:8px;align-items:flex-start;padding:9px 0}.field{display:grid;gap:5px;margin-bottom:11px}.field label{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}.field input,.field select,.field textarea{border:1px solid #bfcdda;border-radius:4px;padding:8px;background:white;color:var(--ink)}.hint{font-size:10px;color:var(--muted);line-height:1.4}.preview{background:#f8fafc;border:1px solid #dbe4eb;padding:12px;border-radius:5px}.preview-row{display:flex;justify-content:space-between;border-bottom:1px solid #e4ebf0;padding:7px 0;font-size:12px}.preview-row:last-child{border-bottom:0}.preview-row b{color:#204a6c}.nextbox{display:flex;flex-direction:column;justify-content:space-between}.next-list{display:grid;gap:7px}.next-item{display:flex;gap:10px;align-items:center;font-size:12px}.next-item i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#dce6ee;font-style:normal}.next-item.done i{background:#dff1e8;color:var(--green)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:white;border:1px solid var(--line);padding:10px 12px;border-radius:6px;margin-bottom:12px}.toolbar .spacer{flex:1}.notice{padding:10px 12px;border:1px solid #cbdbe7;background:#eef6fb;border-radius:5px;font-size:12px;line-height:1.45}.notice.warn{background:#fff7e8;border-color:#ead7ae}.notice.ok{background:#eaf7ef;border-color:#b9dfc8}.notice.bad{background:#fff0f0;border-color:#e2bcbc}
.hyp{border:1px solid var(--line);background:white;border-radius:6px;margin-bottom:10px}.hyp-head{display:flex;align-items:center;gap:9px;padding:11px 13px;border-bottom:1px solid #e1e8ee}.hyp-id{font-weight:800;background:#edf5fc;color:#1262a2;padding:4px 7px;border-radius:4px}.hyp-head strong{flex:1}.hyp-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}.hyp-grid textarea{min-height:62px}.lock{color:var(--green);font-weight:700}.hash{font:10px ui-monospace,monospace;color:#607b91;word-break:break-all}
.status-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}.stat{background:white;border:1px solid var(--line);border-radius:6px;padding:12px}.stat .k{font-size:10px;color:var(--muted);text-transform:uppercase}.stat .v{font-size:22px;font-weight:800;margin-top:4px}.stat .s{font-size:10px;color:var(--muted);margin-top:2px}.good{color:var(--green)}.warn{color:var(--amber)}.bad{color:var(--red)}
.retained-event{position:absolute;left:18px;right:18px;bottom:48px;background:rgba(8,24,38,.94);border:1px solid #28516d;border-radius:5px;padding:7px 9px;font-size:10px;color:#d9e8f3;min-height:30px}.retained-event b{color:#fff}.agent.active{filter:brightness(1.35);transform:translateY(-3px)}.agent.active .body,.agent.active .head{box-shadow:0 0 18px currentColor}.state.active{border-color:#63b9ef;background:#103451}.market-state-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin:9px 0}.market-state-grid span{padding:6px;background:#091b2b;border:1px solid #17344c;border-radius:4px;font-size:10px;color:#b9ccda}.market-state-grid b{display:block;color:#fff;margin-top:2px}.evidence-chain{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:7px}.evidence-chain span{font-size:9px;padding:5px 4px;text-align:center;border:1px solid #25475f;border-radius:4px;color:#7997aa}.evidence-chain span.on{color:#e9f6ff;border-color:#4f9fd0;background:#10314a}.run-selector{display:flex;gap:6px;margin-bottom:8px}.run-selector select{background:#0a1b2b;color:#dce9f3;border:1px solid #24445d;border-radius:4px;padding:6px;font-size:10px;min-width:0;flex:1}.market-shell{display:grid;grid-template-columns:250px minmax(0,1fr) 350px;gap:12px}.panel{background:#071522;color:#e7f0f7;border:1px solid #17344c;border-radius:7px;overflow:hidden}.panel-head{padding:11px 13px;border-bottom:1px solid #17344c;font-size:12px;font-weight:700;letter-spacing:.03em}.panel-body{padding:12px}.market-canvas{height:430px;position:relative;background:radial-gradient(circle at 50% 55%,#112b42,#071522 62%);overflow:hidden}.world{height:310px;display:flex;align-items:center;justify-content:center;gap:10px}.state{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;border:1px solid #47779a;background:#0b2439;box-shadow:0 0 30px rgba(70,165,225,.12);font-size:14px}.agent{width:68px;text-align:center}.person{height:62px;width:45px;position:relative;margin:auto}.head{position:absolute;left:12px;top:2px;width:21px;height:21px;border-radius:50%;background:currentColor}.body{position:absolute;left:4px;top:21px;width:37px;height:38px;border-radius:50% 50% 35% 35%;background:currentColor}.aa{color:#57b7ff}.bb{color:#ffad68}.cc{color:#61d9b1}.dd{color:#b68cff}.agent b{font-size:14px}.agent small{display:block;color:#7895aa;margin-top:2px}.arrow{color:#6c9bbd;font-size:19px}.timeline{position:absolute;bottom:12px;left:12px;right:12px;display:flex;align-items:center;gap:7px}.track{height:4px;background:#244158;flex:1;border-radius:4px}.track i{display:block;width:35%;height:4px;background:#4ca8e6;border-radius:4px}.liveplots{display:grid;grid-template-columns:1fr 1fr;gap:8px}.plot{height:130px;border:1px solid #1a3850;background:#091a29;border-radius:5px;padding:9px}.plot h4{margin:0;font-size:11px}.plot svg{width:100%;height:90px}.orderbook{height:155px;display:flex;align-items:end;justify-content:center;gap:4px;border-bottom:1px solid #31516a}.bar{width:14px;background:#3a88c6}.bar.sell{background:#c67949}.event{display:grid;grid-template-columns:1fr 1fr;gap:12px}.event .big{font-size:20px;font-weight:800}.event p{margin:7px 0;font-size:11px}.tabs{display:flex;gap:4px;border-bottom:1px solid #1a3850}.tabs button{background:transparent;border:0;color:#7895aa;padding:8px 9px;font-size:10px}.tabs button.active{color:white;border-bottom:2px solid #54ace8}.table{width:100%;border-collapse:collapse;font-size:11px}.table th,.table td{padding:7px 8px;border-bottom:1px solid #17344c;text-align:left}.table th{color:#7895aa}.table tr:hover td{background:#0c2235}
.results-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:12px}.metric-card{background:white;border:1px solid var(--line);border-radius:6px;padding:13px}.metric-card .label{font-size:10px;color:var(--muted);text-transform:uppercase}.metric-card .value{font-size:24px;font-weight:800;margin:4px 0}.metric-card .ci{font-size:10px;color:var(--muted)}.bar-chart{height:210px;display:flex;align-items:end;gap:10px;padding:12px 8px 5px;background:#f8fafc;border:1px solid #dfe7ed}.barcol{flex:1;display:flex;flex-direction:column;justify-content:end;height:100%;align-items:center;gap:5px}.barcol i{width:65%;max-width:45px;background:#3a91d2;border-radius:3px 3px 0 0}.barcol span{font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:75px}.barcol em{font-size:9px;font-style:normal;color:#47657b}.data-table{max-height:440px;overflow:auto;background:white;border:1px solid var(--line)}
.detail-grid{display:grid;grid-template-columns:280px 1fr;gap:12px}.trace{display:grid;gap:6px}.trace-row{display:grid;grid-template-columns:110px 1fr;gap:8px;padding:8px;background:#f7fafc;border:1px solid #e1e8ee;font-size:11px}.trace-row b{color:#527087}.json{white-space:pre-wrap;word-break:break-word;font:10px ui-monospace,monospace;background:#071522;color:#dce9f3;padding:12px;border-radius:5px;max-height:520px;overflow:auto}
@media(max-width:1200px){.market-shell{grid-template-columns:210px 1fr}.market-shell>.panel:last-child{grid-column:1/3}.grid3{grid-template-columns:1fr 1fr}.status-grid{grid-template-columns:repeat(2,1fr)}.results-grid{grid-template-columns:1fr}}
@media(max-width:820px){.app{grid-template-columns:1fr}.rail{height:auto;position:static;padding:10px;display:flex;align-items:center;gap:10px}.logo{padding:0}.logo small,.rail-foot{display:none}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.main{min-width:0}.top{padding:0 14px}.content{padding:14px}.grid3,.grid2,.grid4,.hyp-grid{grid-template-columns:1fr}.market-shell{grid-template-columns:1fr}.market-shell>.panel:last-child{grid-column:auto}.market-canvas{height:360px}.world{transform:scale(.78);gap:4px}.stepbar{grid-template-columns:repeat(3,1fr)}}

.tip-anchor{position:relative;display:inline-flex;align-items:center;gap:6px}.tip-q{display:inline-grid;place-items:center;width:15px;height:15px;border:1px solid #9bb1c2;border-radius:50%;font-size:9px;line-height:1;color:#537089;background:#f7fafc;cursor:help;flex:0 0 auto}.tip-q:hover,.tip-q:focus{background:#eaf4fc;border-color:#1976d2;color:#0f5fae}.ui-tip{position:fixed;z-index:9999;max-width:310px;padding:9px 11px;background:#071522;color:#edf6fc;border:1px solid #31536e;border-radius:5px;box-shadow:0 8px 24px rgba(5,20,34,.25);font-size:11px;line-height:1.4;pointer-events:none;opacity:0;transform:translateY(3px);transition:opacity .12s ease,transform .12s ease}.ui-tip.show{opacity:1;transform:translateY(0)}
.demote-banner{background:#102a40;color:#dceaf6;padding:9px 16px;font-size:11px;line-height:1.4;border-bottom:1px solid #1e3a52;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.demote-banner b{color:#fff}.demote-banner a{color:#9ec9e8;font-weight:700;text-decoration:none;margin-left:10px}
.rail-links{display:grid;gap:4px;margin:10px 8px 0;font-size:10px}.rail-links a{color:#9db2c5;text-decoration:none}.rail-links a:hover{color:#fff}
</style></head>
<body>

<div class="app">
<aside class="rail"><div class="logo">CoAgentics<small>Market Lab · secondary</small></div><nav class="nav" id="nav"></nav><div class="rail-links"><a href="/">→ Interface (primary)</a><a href="/live.html">→ Research Console</a></div><div class="rail-foot">Scientific workbench<br>Observable → measured → verified</div></aside>
<main class="main"><header class="top"><div><div class="top-title" id="pageTitle">Experiment design</div><div class="top-sub">Build the experiment first. Then inspect what happened.</div></div><div class="top-spacer"></div><div class="status"><i class="dot" id="runtimeDot"></i><span id="runtimeStatus">Runtime not checked</span></div><button class="btn" id="refreshRuntime">Refresh</button></header>
<div class="content"><div class="stepbar" id="stepbar"></div>
<section class="page active" id="page-design"></section>
<section class="page" id="page-expectations"></section>
<section class="page" id="page-qualify"></section>
<section class="page" id="page-run"></section>
<section class="page" id="page-results"></section>
<section class="page" id="page-evidence"></section>
</div></main></div>
<script>
const steps=[['design','Experiment design','Define the test'],['expectations','Research expectations','Freeze H01…'],['qualify','Qualification','Validate market + runtime'],['run','Run','Execute cells'],['results','Results','Compare models + effects'],['evidence','Evidence','Inspect decision traces']];
let state={step:'design',expectations:null,preflight:null,qualification:null,campaign:null,charts:null,analysis:null,cells:null,selected:null,runTimer:null};
const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function api(path,opt={}){const r=await fetch(path,{cache:'no-store',...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});const d=await r.json().catch(()=>({error:'Invalid server response'}));if(!r.ok||d.error)throw new Error(d.error||('HTTP '+r.status));return d}
const get=p=>api(p); const post=(p,b)=>api(p,{method:'POST',body:JSON.stringify(b)});
function nav(){ $('nav').innerHTML=steps.map((s,i)=>`<button data-step="${s[0]}" class="${state.step===s[0]?'active':''}"><span class=num>${i+1}</span>${s[1]}</button>`).join('')+`<button data-step="design" style="margin-top:14px">↻ New experiment</button>`;document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>go(b.dataset.step));}
function stepbar(){ $('stepbar').innerHTML=steps.map((s,i)=>`<div class="step ${state.step===s[0]?'active':i<steps.findIndex(x=>x[0]===state.step)?'done':''}">${i+1}. ${s[1]}<small>${s[2]}</small></div>`).join('');}
function go(s){state.step=s;nav();stepbar();document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));$('page-'+s).classList.add('active');$('pageTitle').textContent=steps.find(x=>x[0]===s)[1];render();}
function render(){if(state.step==='design')renderDesign();if(state.step==='expectations')renderExpectations();if(state.step==='qualify')renderQualify();if(state.step==='run')renderRun();if(state.step==='results')renderResults();if(state.step==='evidence')renderEvidence();}
function renderDesign(){const ex=state.expectations||{sample_size:{planned_seeds:20,minimum_complete:18},expectations:[]};$('page-design').innerHTML=`<div class=hero><div><h1>What are you testing?</h1><p>Set the experimental design before you look at outcomes.</p></div><div class=hero-actions><button class=btn id=loadDesign title="Reload the persisted experiment design.">Load current</button><button class=btn id=saveDesign title="Persist this experimental design.">Save design</button><button class="btn primary" id=toExp title="Save the design and move to preregistered research expectations.">Continue to research expectations →</button></div></div>
<div class=grid3>
<div class=card><h2>1. What are you testing?</h2><div class=card-body>
<label class=choice><input data-objective=compare_llms type=checkbox checked><span><b>Compare LLMs</b><small>How do different models behave in the same market?</small></span></label>
<label class=choice><input data-objective=study_market_interaction type=checkbox><span><b>Study market interaction</b><small>How do models adapt to other agents?</small></span></label>
<label class=choice><input data-objective=test_information_effects type=checkbox><span><b>Test information effects</b><small>News, history, or peer observation</small></span></label>
<label class=choice><input data-objective=compare_frozen_sequential type=checkbox checked><span><b>Compare frozen vs sequential</b><small>Same snapshot vs evolving market</small></span></label>
<label class=choice><input data-objective=counterfactual_model_substitution type=checkbox><span><b>Counterfactual model substitution</b><small>Same decision context, different models</small></span></label></div></div>
<div class=card><h2>2. Models and population</h2><div class=card-body><div class=field><label>Runtime model catalog</label><div id=designModels class=notice>Checking model catalog…</div></div><div class=label style="font-size:11px;color:var(--muted);font-weight:700">POPULATION DESIGN</div>
<label class=radio-row><input type=radio name=pop value=heterogeneous_multi_llm checked><span><b>Heterogeneous multi-LLM</b><small class=hint>Selected models trade in the same market.</small></span></label>
<label class=radio-row><input type=radio name=pop value=reference_counterparty><span><b>Single LLM vs reference</b><small class=hint>One model versus a programmed counterparty.</small></span></label></div></div>
<div class=card><h2>3. Market design</h2><div class=card-body><div class=field><label>Market mechanism</label><select id=mechanism><option>Continuous double auction (CDA)</option><option>Sealed-bid</option></select></div><div class=label style="font-size:11px;color:var(--muted);font-weight:700">ACTIVATION DESIGN</div>
<label class=radio-row><input type=radio name=activation value=frozen_snapshot><span><b>Frozen Snapshot</b><small class=hint>All agents see the same public market snapshot.</small></span></label>
<label class=radio-row><input type=radio name=activation value=sequential_interaction checked><span><b>Sequential Interaction</b><small class=hint>Agents act in sequence and see updated market state.</small></span></label>
<label class=radio-row><input type=radio name=activation value=both><span><b>Both designs</b><small class=hint>Run separate experimental cells for each design.</small></span></label>
<div class=preview style="margin-top:8px"><div style="display:flex;justify-content:space-around;text-align:center;font-size:10px"><span>Frozen<br><b>● ● ● ●</b></span><span>Sequential<br><b>● → ● → ● → ●</b></span></div></div></div></div>
</div>
<div class=grid3 style="margin-top:14px"><div class=card><h2>4. Experimental controls</h2><div class=card-body><div class=field><label>Number of seeds</label><input id=seedCount type=number min=1 value="${ex.sample_size?.planned_seeds||20}"></div><div class=field><label>Repeats per cell</label><input id=repeatCount type=number min=1 value="3"></div><div class=field><label>Role assignment</label><select id=roleAssignment><option value=balanced_crossover>Balanced crossover</option></select></div><div class=field><label>Private values</label><select id=privateValues><option value=crossover>Crossover</option></select></div><div class=field><label>Activation order</label><select id=activationOrder><option value=randomized_balanced>Randomized (balanced)</option></select></div><details><summary class=hint>Advanced settings</summary><p class=hint>Keep advanced mechanism, information, and stopping-rule settings out of the main path unless needed.</p></details></div></div>
<div class=card><h2>5. Experiment design preview</h2><div class=card-body><div class=preview id=designPreview></div></div></div>
<div class="card nextbox"><h2>6. Next step</h2><div class=card-body><div class=next-list><div class="next-item done"><i>1</i><span><b>Experiment design</b><small class=hint>Configure models, market, and controls</small></span></div><div class=next-item><i>2</i><span><b>Research expectations</b><small class=hint>Define and freeze H01, H02…</small></span></div><div class=next-item><i>3</i><span><b>Qualification</b><small class=hint>Validate market and model runtime</small></span></div><div class=next-item><i>4</i><span><b>Run</b><small class=hint>Execute the experiment</small></span></div><div class=next-item><i>5</i><span><b>Results</b><small class=hint>Analyze and compare expectations</small></span></div><div class=next-item><i>6</i><span><b>Evidence</b><small class=hint>Inspect decision traces</small></span></div></div></div></div></div>`;

ummary of the exact retained event currently selected. Click a model and seed to inspect a persisted cell.">No retained turn selected.</div><div class=timeline><span id=runPlayGlyph>●</span><div class=track><i id=runTrack></i></div><span id=runTime class=hint>0%</span></div></div></div><div class=panel><div class=panel-head data-tip="Shows the market state recorded immediately around the selected retained turn, plus the provenance status of that turn.">Current state <span class=hint style="float:right">selected retained turn</span></div><div class=panel-body><div id=runCurrent class=hint>No campaign activity yet.</div><div id=runMarketState class=market-state-grid></div><hr style="border-color:#17344c"><div class=hint>Evidence chain</div><div id=runEvidenceChain class=evidence-chain><span>Observed</span><span>Parsed</span><span>Legal</span><span>Accepted</span><span>Executed</span><span>Payoff</span></div></div></div></div>`;$('refreshRun').onclick=refreshCampaign;$('startRun').onclick=startCampaign;$('cancelRun').onclick=cancelCampaign;refreshCampaign();populateRunSelectors();}

async function loadResults(){try{state.charts=await get('/api/dv026/campaign/charts');state.analysis=await get('/api/dv026/campaign/analysis');state.cells=await get('/api/dv026/campaign/cells')}catch(e){console.warn(e)}}
function renderResults(){if(!state.analysis||!state.charts)loadResults().then(renderResults);$('page-results').innerHTML=`<div class=hero><div><h1>Results</h1><p>Observed outcomes only. Empty metrics remain empty until the campaign produces data.</p></div><div class=hero-actions><button class=btn id=refreshResults>Refresh</button><button class=btn onclick="go('evidence')">Evidence →</button></div></div><div id=resultBody><div class=notice>Loading persisted campaign results…</div></div>`;renderResultBody();$('refreshResults').onclick=async()=>{await loadResults();renderResultBody()}}
function renderResultBody(){const a=state.analysis,c=state.charts;if(!a||!c)return;const o=a.overall||{};const st=o.efficiency||{};const models=a.models||[];$('resultBody').innerHTML=`<div class=status-grid><div class=stat><div class=k>Complete cells</div><div class=v>${a.cells||0}</div><div class=s>Persisted seed cells</div></div><div class=stat><div class=k>Mean efficiency</div><div class=v>${fmt(st.mean)}</div><div class=s>95% CI ${fmtCI(st)}</div></div><div class=stat><div class=k>Layer A reference</div><div class=v>${fmt(c.layer_a_mean_efficiency_cda)}</div><div class=s>Market qualification only</div></div><div class=stat><div class=k>LLM cells</div><div class=v>${c.human_ref?.live_mean_n||0}</div><div class=s>Observed treatment efficiency</div></div></div><div class=results-grid><div class=card><h2>Model comparison</h2><div class=card-body>${models.length?`<div class=bar-chart>${models.map(m=>{const v=m.efficiency?.mean;const h=v==null?2:Math.max(3,Math.min(180,Math.abs(v)));return `<div class=barcol><em>${fmt(v)}</em><i style="height:${h}px"></i><span>${esc(m.model)}</span></div>`}).join('')}</div>`:'<div class=notice>No campaign cells available.</div>'}</div></div><div class=card><h2>Observed metrics</h2><div class=card-body><div class=grid2>${[['Efficiency',o.efficiency],['Δ Efficiency',o.delta_efficiency],['Δ Surplus',o.delta_surplus],['Δ Mean Price',o.delta_mean_price]].map(x=>`<div class=metric-card><div class=label>${x[0]}</div><div class=value>${fmt(x[1]?.mean)}</div><div class=ci>${fmtCI(x[1])}</div></div>`).join('')}</div></div></div></div><div class=card style="margin-top:12px"><h2>Model cells</h2><div class=card-body><div class=data-table><table class=table style="color:var(--ink)"><thead><tr><th>Model</th><th>Cells</th><th>Efficiency</th><th>Parse</th><th>Valid</th><th>Accepted</th><th>Executed</th></tr></thead><tbody>${models.map(m=>`<tr><td>${esc(m.model)}</td><td>${m.cells}</td><td>${fmt(m.efficiency?.mean)}</td><td>${pct(m.parse_rate)}</td><td>${pct(m.valid_rate)}</td><td>${pct(m.acceptance_rate)}</td><td>${pct(m.execution_rate)}</td></tr>`).join('')}</tbody></table></div></div></div>`}
const fmt=v=>v==null||!Number.isFinite(Number(v))?'—':Number(v).toFixed(2);const pct=v=>v==null?'—':(100*Number(v)).toFixed(1)+'%';const fmtCI=s=>s&&s.ci95_low!=null?`[${fmt(s.ci95_low)}, ${fmt(s.ci95_high)}]`:'—';
async function renderEvidence(){if(!state.cells)try{state.cells=await get('/api/dv026/campaign/cells')}catch(e){}$('page-evidence').innerHTML=`<div class=hero><div><h1>Evidence</h1><p>Move from a model × seed cell into the retained decision trace.</p></div><button class=btn onclick="go('results')">← Results</button></div><div class=card><h2>Cells</h2><div class=card-body><div class=data-table><table class=table style="color:var(--ink)"><thead><tr><th>Model</th><th>Seed</th><th>Turns</th><th>Cell OK</th><th>Efficiency</th><th>Δ</th><th>Open</th></tr></thead><tbody id=cellRows></tbody></table></div></div></div><div id=cellDetail style="margin-top:12px"></div>`;const rows=state.cells?.cells||[];$('cellRows').innerHTML=rows.length?rows.map((r,i)=>`<tr><td>${esc(r.model)}</td><td>${r.seed}</td><td>${r.turns}</td><td class=${r.cell_ok?'good':'bad'}>${r.cell_ok?'YES':'NO'}</td><td>${fmt(r.treatment_efficiency)}</td><td>${fmt(r.delta_efficiency)}</td><td><button class="btn secondary" data-cell="${i}">Open</button></td></tr>`).join(''):'<tr><td colspan=7>No evidence cells available.</td></tr>';document.querySelectorAll('[data-cell]').forEach(b=>b.onclick=()=>openCell(rows[+b.dataset.cell]));}
async function openCell(r){try{const d=await get('/api/dv026/campaign/cell?model='+encodeURIComponent(r.model)+'&seed='+r.seed);$('cellDetail').innerHTML=`<div class=detail-grid><div class=card><h2>Cell summary</h2><div class=card-body><div class=preview-row><span>Model</span><b>${esc(r.model)}</b></div><div class=preview-row><span>Seed</span><b>${r.seed}</b></div><div class=preview-row><span>Turns</span><b>${r.turns}</b></div><div class=preview-row><span>Cell OK</span><b>${r.cell_ok?'YES':'NO'}</b></div></div></div><div class=card><h2>Decision trace</h2><div class=card-body><pre class=json>${esc(JSON.stringify(d,null,2))}</pre></div></div></div>`}catch(e){$('cellDetail').innerHTML=`<div class="notice bad">${esc(e.message)}</div>`}}
$('refreshRuntime').onclick=loadPreflight;nav();stepbar();Promise.all([loadExpectations(),loadDesign()]).then(()=>{render();setupTips()}).catch(()=>{render();setupTips()});

function tipTextFor(el){
  if(el.dataset.tip)return el.dataset.tip;
  const raw0=(el.dataset.tipKey||el.innerText||el.textContent||'').replace(/\s+/g,' ').trim(); const raw=raw0.replace(/^\d+[.)]\s*/,'').replace(/\s+→$/,'').trim();
  if(!raw)return null;
  if(TIP_TEXT[raw])return TIP_TEXT[raw];
  for(const k of Object.keys(TIP_TEXT)){if(raw.startsWith(k))return TIP_TEXT[k]}
  return null;
}
function setupTips(){
  let tip=document.getElementById('uiTip');
  if(!tip){tip=document.createElement('div');tip.id='uiTip';tip.className='ui-tip';document.body.appendChild(tip)}
  const selectors='h1,h2,h3,.field label,.choice,.radio-row,.next-item,.stat,.metric-card,.panel-head,.table th,.preview-row,.tabs button,.toolbar label,.notice,.nav button,.step,.top-title,.top-sub';
  document.querySelectorAll(selectors).forEach(el=>{
    if(el.dataset.tipDone)return;
    const t=tipTextFor(el); if(!t)return;
    el.dataset.tipDone='1';el.dataset.tip=t;
    const q=document.createElement('span');q.className='tip-q';q.tabIndex=0;q.setAttribute('aria-label','More information');q.textContent='?';
    q.addEventListener('mouseenter',()=>showTip(q));q.addEventListener('mouseleave',hideTip);q.addEventListener('focus',()=>showTip(q));q.addEventListener('blur',hideTip);
    if(el.matches('.choice,.radio-row,.next-item,.stat,.metric-card,.panel-head,.preview-row,.notice')){el.classList.add('tip-anchor');el.appendChild(q)}
    else{el.classList.add('tip-anchor');el.appendChild(q)}
  });
  document.querySelectorAll('button,input,select,textarea').forEach(el=>{
    if(el.dataset.tipDone)return;
    const txt=el.getAttribute('aria-label')||el.getAttribute('title')||el.value||el.textContent||''; const t=TIP_TEXT[String(txt).trim()];
    if(!t)return;el.dataset.tipDone='1';el.dataset.tip=t;el.title=t;
  });
}
let activeTip=null; function showTip(q){const t=q.parentElement.dataset.tip;if(!t)return;const r=q.getBoundingClientRect();activeTip=document.getElementById('uiTip');activeTip.textContent=t;activeTip.classList.add('show');let x=r.left,y=r.bottom+7;if(x+310>innerWidth)x=innerWidth-320;if(y+120>innerHeight)y=r.top-8-activeTip.offsetHeight;activeTip.style.left=Math.max(8,x)+'px';activeTip.style.top=Math.max(8,y)+'px'}
function hideTip(){if(activeTip)activeTip.classList.remove('show')}
const tipObserver=new MutationObserver(()=>setupTips());tipObserver.observe(document.body,{subtree:true,childList:true});
