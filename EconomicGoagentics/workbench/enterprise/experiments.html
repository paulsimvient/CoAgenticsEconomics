<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>CoAgentics — Experiments</title><link rel=stylesheet href=app.css></head><body><script src=app.js></script><script>
CoA.shell('experiments','',`<div class=eyebrow>EXPERIMENT REGISTRY</div><div class=h1>Experiments</div><p class=sub>Versioned, governed experiments across the research portfolio. Registry status is derived from the connected DV026 lifecycle and campaign state.</p><div class=actions><a class="btn primary" href=experiment.html>Open current experiment</a><button class=btn onclick="location.reload()">Refresh</button></div><div class=card style="margin-top:16px"><table class=table><thead><tr><th>ID</th><th>Name</th><th>Version</th><th>Status</th><th>Evidence</th><th>Updated</th></tr></thead><tbody id=rows><tr><td colspan=6>Loading connected registry…</td></tr></tbody></table></div><div class="notice" style="margin-top:12px">Enterprise V11 rule: experiment status is not inferred from presentation labels. The connected lifecycle/campaign endpoints remain authoritative.</div>`);
function render(e){const l=e.lifecycle||{},s=e.status||{};const state=(l.state||s.status||'idle');const pct=Array.isArray(e.state?.events)?Math.min(100,Math.round(e.state.events.length/Math.max(1,e.state.events.length+1)*100)):0;document.getElementById('rows').innerHTML=`<tr><td><a href=experiment.html>EXP-026</a></td><td>Peer Visibility</td><td>${l.version||'current'}</td><td><span class="pill ${state==='running'?'green':''}">${state}</span></td><td>${pct}% live state</td><td>Now</td></tr><tr><td>—</td><td>New experiments</td><td>—</td><td><span class=pill>Ready</span></td><td>Not registered</td><td>—</td></tr>`}
window.addEventListener('coa:data',ev=>render(ev.detail));</script></body></html>
