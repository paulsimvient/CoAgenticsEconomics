<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>CoAgentics — Research Portfolio</title><link rel=stylesheet href=app.css></head><body><script src=app.js></script><script>
CoA.shell('portfolio','',`<div class="portfolio-hero"><div class=eyebrow>RESEARCH PLATFORM</div><div class=h1>CoAgentics</div><p class=sub>Experimental validation for AI systems. Discover, test, explain, validate, and govern observable AI behavior.</p><div class=actions><a class="btn primary" href=experiments.html>Open experiments</a><a class=btn href=workspace.html>Open workspace</a><a class=btn href=briefing.html>Briefing mode</a></div></div>
<div class=grid4 id=portfolio-metrics><div class="card cardbody metric"><strong data-stat=active>—</strong><span>Active experiments</span><small data-stat=active-detail>Loading live registry…</small></div><div class="card cardbody metric"><strong data-stat=observations>—</strong><span>Observed records</span><small>From current campaign state</small></div><div class="card cardbody metric"><strong data-stat=agents>—</strong><span>Agents / cells</span><small>Persisted campaign objects</small></div><div class="card cardbody metric"><strong data-stat=attention>—</strong><span>Research attention</span><small>Derived from lifecycle + reviews</small></div></div>
<div class=grid3 style="margin-top:12px"><div class=card><div class=cardhead>Research Activity <span class=eyebrow>LIVE</span></div><div class=cardbody id=activity><p>Loading audit activity…</p></div></div><div class=card><div class=cardhead>Evidence Growth</div><div class=chart id=evidence-chart><div class=line></div><div class=axis><span>EARLY</span><span>MID</span><span>LATE</span></div></div></div><div class=card><div class=cardhead>Research Domains</div><div class=cardbody><p><b>Economic Behavior</b><br><small>DV026 flagship workspace</small></p><p><b>Mission Systems</b><br><small>Experimental AI assurance</small></p><p><b>Human-AI Interaction</b><br><small>Behavior under controlled intervention</small></p></div></div></div>`);
function fmt(n){return n==null?'—':Number(n).toLocaleString();}
function render(e){const s=e.status||{},st=e.state||{},cells=e.cells||{};document.querySelector('[data-stat=active]').textContent=s.status==='running'?'1':'—';document.querySelector('[data-stat=active-detail]').textContent=s.status?String(s.status).toUpperCase():'No active campaign';const events=Array.isArray(st.events)?st.events.length:(st.event_count||s.event_count||0);document.querySelector('[data-stat=observations]').textContent=fmt(events);const count=Array.isArray(cells.cells)?cells.cells.length:(cells.count||0);document.querySelector('[data-stat=agents]').textContent=fmt(count);const lifecycle=e.lifecycle||{};document.querySelector('[data-stat=attention]').textContent=(lifecycle.review_count??'—');const a=e.audit?.events||[];document.getElementById('activity').innerHTML=a.length?a.slice(-5).reverse().map(x=>`<p><b>${x.action||'Event'}</b><br><small>${x.actor||'system'} · ${x.ts||x.timestamp||''}</small></p>`).join(''):'<p>No audit events yet.</p>';}
window.addEventListener('coa:data',ev=>render(ev.detail));
</script></body></html>
